[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qsignt"
version = "0.1.0"
description = "QsigNT signer 注册工具：OpenPGP 上行 + X25519 下行"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.urls]
Repository = "https://github.com/AmritaBot/qsignt.py"
Issues = "https://github.com/AmritaBot/qsignt.py/issues"

[project.scripts]
qsignt = "qsignt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff 自身规则
    "PL",   # pylint 子集
    "BLE",  # 禁止 except Exception
]
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
